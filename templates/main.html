<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="background-pattern"></div>

<div class="container">
    <header>
        <div class="title_">
            <h1>Check the Credibility of Any News Article in Seconds</h1>
        </div>
        <p class="tagline">Paste a news link, and our system will analyze it for credibility using AI and linguistic patterns.</p>
    </header>

    <div class="main-card">

        {% if error %}
        <div class="error-banner">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <!-- ✅ Real form that submits to Flask -->
        <form id="newsForm" method="POST" action="/analyze">
            <div class="input-section">
                <div class="input-container">
                    <input
                        type="url"
                        id="newsUrl"
                        name="url"
                        class="news-input"
                        style="text-align: center;"
                        placeholder="Paste News Article URL (e.g., https://rappler.com/article)"
                        required
                    >
                </div>
            </div>

            <button class="analyze-btn" id="analyzeBtn" type="submit">
                <i class="fas fa-search"></i> Check Credibility
            </button>
        </form>

        <div class="loading" id="loading" style="display:none;">
            <div class="spinner"></div>
            <span>Analyzing content with AI...</span>
        </div>

    </div>
</div>

<script>
    // Show loading spinner when form is submitted
    document.getElementById('newsForm').addEventListener('submit', function() {
        document.getElementById('analyzeBtn').disabled = true;
        document.getElementById('loading').style.display = 'block';
    });
</script>

</body>
</html>
